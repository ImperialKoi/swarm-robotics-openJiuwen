# The demo scenario. Every tunable constant lives here, never in node code.
#
# Scaled for a 512-robot swarm (see docs/MEASUREMENTS.md M-1). Robot count and mission
# size are coupled: a large swarm on a small map clears all fog in seconds, leaves the
# auction with nothing to allocate, and makes the scripted failure invisible. Every
# number below moved together.
#
# Fast tests use assets/scenarios/test.yaml, not this file.
name: demo

map:
  width_m: 320.0
  height_m: 216.0
  cell: 1.0                    # -> 320 x 216 = 69,120 cells; 20% less area
                               # 1.0 m, not 0.5: distance-field BFS cost is O(cells x
                               # diameter), so a 4x finer grid on a 10x larger map is
                               # ~40x the auction cost. Robot radii (0.22-0.45 m) still
                               # sit inside one cell, so collision response is unchanged.
  sector_rows: 6               # A..F
  sector_cols: 8               # 1..8  -> 48 sectors, each 40 x 36 m
                               # Held at 48 on purpose: the hivemind prompt carries one
                               # line per sector, and 80 sectors bloats it for no gain.
  # The authored profile places buildings, trees and debris by terrain region.
  n_clusters: 0
  cluster_radius_m: [2.5, 9.0]
  rubble_fraction: 0.35

terrain:
  # Generic-generator parameters are inactive with reference set. Depth ranges also
  # describe the wading bands checked by the shared terrain invariants.
  hills: 0
  hill_radius_m: [26.0, 68.0]
  hill_steepness: [0.10, 0.22]
  mountains: 0
  mountain_radius_m: [48.0, 82.0]
  mountain_steepness: [0.26, 0.45]
  marshes: 0
  marsh_radius_m: [13.5, 25.5]
  marsh_depth_m: [0.20, 0.38]
  rivers: 0
  river_width_m: [14.0, 22.0]
  river_depth_m: [0.90, 1.10]
  river_fords: 0
  ditches: 0
  ditch_length_m: [30.0, 90.0]
  ditch_width_m: [2.5, 4.5]
  ditch_depth_m: [1.0, 1.8]

  # Reference-based crop of the owner's confluence photographs: a small local area,
  # not the whole valley shrunk to fit. Coordinates are illustrative local metres,
  # not georeferenced survey data. See docs/NEPAL_TERRAIN.md for scale and limits.
  reference:
    map_m: [320.0, 216.0]
    road_width_m: 4.8
    road_grade: 0.22
    bank_clearance_m: 4.0
    bank_height_m: 0.65
    terrace_grade: 0.14
    shoulder_distance_m: [18.0, 95.0]
    shoulder_rise_m: 18.0
    tree_spacing_m: 7.0
    tree_radius_m: [1.3, 2.1]
    foundation_shoulder_m: 5.0
    debris_patches: 130
    debris_radius_m: [1.0, 3.0]
    # Two headwaters and one outlet: one confluence, not intersecting canals.
    channels:
      - width_m: 18.0
        depth_m: 1.05
        points: [[226, -12, 9.0], [222, 20, 8.2], [211, 49, 7.3], [188, 83, 6.0], [156, 108, 5.0]]
      - width_m: 14.0
        depth_m: 0.90
        points: [[336, 181, 9.0], [290, 163, 8.0], [248, 144, 7.0], [204, 124, 6.0], [156, 108, 5.0]]
      - width_m: 22.0
        depth_m: 1.10
        points: [[156, 108, 5.0], [130, 136, 4.0], [109, 173, 2.7], [101, 199, 1.8], [98, 228, 0.8]]
    # Roads follow the terraces. Only the two short junction crossings span water.
    roads:
      - [[30, 40], [70, 66], [111, 72], [143, 64], [182, 51], [196, 26], [202, 6]]
      - [[70, 66], [48, 96], [40, 141], [45, 178], [30, 208]]
      - [[143, 64], [125, 85], [136, 99], [172, 119], [192, 143], [232, 165], [270, 188], [297, 208]]
      - [[172, 119], [194, 103], [225, 86], [241, 55], [253, 20], [285, 12]]
    # [southwest x, y, footprint width, depth], all in metres. Small terrace hamlets.
    buildings:
      - [77, 51, 8, 6]
      - [89, 54, 7, 8]
      - [106, 44, 8, 6]
      - [119, 49, 7, 8]
      - [149, 44, 8, 7]
      - [164, 32, 7, 8]
      - [181, 10, 8, 6]
      - [169, 10, 8, 7]
      - [21, 105, 7, 8]
      - [51, 111, 8, 7]
      - [20, 116, 7, 8]
      - [51, 148, 8, 7]
      - [25, 161, 7, 8]
      - [53, 180, 8, 7]
      - [69, 194, 8, 6]
      - [244, 78, 8, 7]
      - [246, 66, 7, 8]
      - [257, 42, 8, 7]
      - [269, 34, 8, 6]
      - [171, 152, 8, 7]
      - [211, 164, 8, 7]
      - [233, 183, 8, 7]
    # Ellipses: centre x/y and radii. Forest stays above the river floodplain.
    woodlands: [[75, 12, 82, 32], [8, 87, 23, 52], [67, 143, 19, 60],
                [177, 200, 49, 52], [272, 95, 51, 60], [308, 32, 39, 42],
                [306, 210, 58, 18]]
    landslides: [[192, 145, 29, 13], [255, 153, 30, 11], [139, 104, 18, 13]]

# Collection points lie on the terrace-road network, clear of the three channels.
base: [30.0, 40.0]
extraction_zones: [[111.0, 72.0], [196.0, 26.0], [48.0, 96.0], [40.0, 141.0],
                   [30.0, 208.0], [192.0, 143.0], [232.0, 165.0], [297.0, 208.0],
                   [225.0, 86.0], [253.0, 20.0], [285.0, 12.0]]
extraction_radius: 6.0

robots_per_lane: 128           # 512 total; roster unchanged for the new crop

# Lane sizes are NOT even, and the even split was costing the mission.
#
# The relay network saturates: posts must sit 0.75 x relay_radius apart, and the
# generator caps chains at 10 x 4 = 40 posts. Measured, only 14 of 192 relays ever
# received one -- the other 178 stood at spawn for the whole mission, a quarter of the
# swarm doing nothing. Meanwhile exploration is the binding constraint on everything
# downstream: no coverage, no contacts, no rescues.
#
# So: scouts dominate, diggers outnumber carriers, relays are sized to the number of
# posts the network can actually hold plus a margin for losses.
# Measured, not chosen (MEASUREMENTS.md M-33). Relay count was swept against the thing
# it actually controls -- comms coverage, which gates fog reveal and therefore everything
# downstream. 48 / 96 / 144 relays gave 76 / 83 / 86% comms and 30.0 / 35.5 / 31.8%
# explored: too few and the network cannot reach, too many and they are taken from the
# scouts who do the reaching.
lane_counts:
  none:    171        # scouts -- coverage is what everything else waits on
  scoop:   117        # diggers -- 32 casualties are buried and need one first
  gripper:  96        # carriers
  antenna: 128        # relays -- raised from 96 for coverage, deliberately. M-49 found
                      # 96 was the rescue-optimal count and 128 slightly worse, but M-64
                      # showed comms gates *exploration and discovery* while rescues are
                      # bounded by delivery time, so the two numbers answer to different
                      # levers and 96 was optimising the one comms cannot move.
                      # Superseded sweep for reference (M-49). 64/96/128 gave
                      # 33.3 / 34.7 / 32.3 rescued and 83 / 88 / 83% in comms: the same
                      # peak at 96 that M-33 found on the 480x320 map with 768 robots,
                      # which is a stronger result than either sweep alone. Past 96 the
                      # relays come out of the scouts who do the reaching. -- ~44 hold posts; the rest extend comms by standing in it
                               # area. Measured ceiling with the real Tier 1 + Tier 2
                               # stack was 3072 robots (MEASUREMENTS.md M-5), so this
                               # is well inside budget; mission size binds, not compute.

victims:
  # 110, not 80. Exploration saturates around t=300 on this map (M-51) and the swarm
  # then has little left to do, which made the last third of a seven-minute demo visibly
  # idle. More casualties keep the rescue chain working through the endgame, and the
  # chain has the capacity: 80 / 110 / 140 gave 34.7 / 45.3 / 51.7 rescued with delivery
  # flat at 59.4 / 60.2 / 57.6% (M-52). 140 raises rescues further but starts diluting
  # the rate; 110 adds 37% more work at the same conversion.
  count: 110
  buried_count: 44             # 40% require a scoop robot before a gripper can extract
  cover_fraction: 0.85        # target at rubble/obstacle margins; some remain exposed
  cover_radius_m: 3.0         # buried sites prefer rubble, surface sites prefer shelter
  min_separation_m: 14.0
  distance_weight_exp: 0.4     # mild bias away from base -- NOT 1.5, see below.
                               #
                               # Placement weight is distance_to_base ** exp. A strong
                               # bias made sense when the swarm cleared the whole map:
                               # it pushed the last casualties far enough out that the
                               # run used its full clock. On a map 2.3x larger the swarm
                               # covers ~42% in 420 s, so the same bias just hides
                               # casualties in ground nobody reaches. Measured at fixed
                               # coverage (MEASUREMENTS.md M-17): 1.5 -> 14 found /
                               # 8 rescued, 0.8 -> 23/14, 0.4 -> 30/18. Coverage is
                               # identical in all three; only reachability changes.
  # Debris cleared per second per digger, capped at MAX_DIGGERS (3) working one
  # casualty. At 0.25 a single digger took 4 s and a crowd took half a second, so
  # "buried" was a label rather than a stage. At 0.12 one digger takes 8 s and three take
  # 2.8 s, and it is **free**: swept at 0.25 / 0.12 / 0.07 it gave 70.50 / 70.75 / 67.75
  # rescued, so digging becomes a real stage at no cost, and 0.07 is where it starts
  # costing (M-66).
  clear_rate: 0.12
  carry_speed_factor: 0.7

hazard:
  ignite_t: 90.0
  radius0: 4.0
  growth_rate: 0.18
  drift_speed: 0.335
  origin_sector: C4
  battery_drain: 0.015

  # Preserve the seven-minute hazard beat. Lengths/speeds are 0.9x the previous
  # 360 x 240 m scenario, matching the crop's linear scale (~sqrt(0.8)).
  # Peak radius: 4 + (240-90)*0.18 = 31 m; fully receded by t=326.1 s.
  peak_t: 240.0
  decay_rate: 0.36

comms:
  base_radius: 40.0
  # 46 m. M-49 swept 38/46/54 m and measured comms 83 -> 92 -> 94% with rescues flat at
  # 33.3 / 32.0 / 33.3, and held it at 38 on the grounds that range bought coverage the
  # mission did not convert. M-64 changes that judgement: comms is what gates exploration
  # and discovery, and an out-of-contact robot cannot even be *given work* -- so range
  # buys the two numbers it can move. 46 rather than 54 because at 54 the network
  # effectively blankets the map and the relay lane stops posing a placement decision.
  relay_radius: 46.0           # Kept at the existing measured range; re-rehearse the crop.

battery:
  idle: 0.0005
  moving: 0.0020

rates:
  tick_hz: 20.0
  fog_hz: 5.0
  comms_hz: 1.0
  sector_hz: 2.0
  auction_hz: 1.0
  blackboard_hz: 10.0
  heartbeat_hz: 2.0
  hivemind_period_s: 6.0
  orphan_timeout_s: 2.0

fault:
  enabled: true
  min_t: 200.0
  # Scale against what the swarm ACHIEVES, not against the victim count.
  #
  # This was 30 -- 25% of 120, scaled from the original 2-of-8 -- and the swarm rescues
  # 23 in a good run, so the state trigger could never fire and the t=260 fallback fired
  # every time. PLAN §2 lists "state-triggered, not wall-clock" as a locked decision, and
  # it had quietly stopped being true. Measured on seed 42: ~12 rescued by t=200, so 10
  # fires the beat the moment the swarm is demonstrably working, and the fallback still
  # covers a run where it is not (MEASUREMENTS.md M-46).
  min_rescued: 10
  fallback_t: 260.0

mission_duration_s: 420.0

# The four maps the demo plays, and the only seeds anything is trained, checked or gated on
# for it. Other seed ranges stay defined in code -- the gate's held-out
# 101-110, the unit-policy check seeds -- but the demo and its runs do not use them.
# Consequence, stated once here so it is not forgotten: a component tuned on these seeds is
# tuned *for these maps*. "Tuned on the four demo maps", never "generalises".
demo_seeds: [42, 43, 44, 45]

bid_weights:
  battery: 20.0
  load: 15.0
  hazard: 40.0
