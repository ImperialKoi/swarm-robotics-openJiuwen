# Optional response team. These are engineering limits, not measured performance claims.
goal: Search the disaster zone, prioritize confirmed rescue work, and adapt to observed hazards and failures.
interval_s: 20.0
deadline_s: 20.0
max_age_s: 20.0
call_timeout_s: 8.0  # native task context; total episode deadline stays 20 s
max_tokens: 400  # must cover hidden reasoning tokens (M-88)
token_budget: 9000
max_candidates: 8
hazard_ceiling: 0.35
explored_ceiling: 0.96
model_url: https://openrouter.ai/api/v1/chat/completions
model: openai/gpt-5.6-terra
